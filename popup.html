<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dev Quick Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <h3>📝 Dev Quick Notes</h3>
    <div class="input-form">
      <input type="text" id="noteTitle" placeholder="Snippet Title (e.g., Docker Run)">
      <textarea id="noteContent" placeholder="Code snippet or note content..."></textarea>
      <button id="addBtn">Save Snippet</button>
    </div>
    <hr>
    <input type="text" id="searchBox" placeholder="🔍 Search notes...">
    <div id="notesList" class="notes-list"></div>
  </div>

  <script src="notes.js"></script>
  <script>
    const mgr = new NoteManager();
    mgr.addNote('Useful Git Alias', 'git config --global alias.st status');

    function render() {
      const q = document.getElementById('searchBox').value;
      const list = mgr.searchNotes(q);
      const container = document.getElementById('notesList');
      container.innerHTML = '';
      list.forEach(n => {
        const div = document.createElement('div');
        div.className = 'note-card';
        div.innerHTML = `<strong>${n.title}</strong><pre>${n.content}</pre>`;
        container.appendChild(div);
      });
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      const title = document.getElementById('noteTitle').value;
      const content = document.getElementById('noteContent').value;
      if (title) {
        mgr.addNote(title, content);
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
        render();
      }
    });

    document.getElementById('searchBox').addEventListener('input', render);
    render();
  </script>
</body>
</html>
